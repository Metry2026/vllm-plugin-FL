name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h20-inference:
    name: H20 inference verification
    uses: ./.github/workflows/_e2e_test.yml
    with:
      platform: cuda
      device: h20
      task: inference
      ci_image: harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.28.0-cuda-ci
      runner_labels: '["vllm-plugin-ci-h20"]'
      container_volumes: '["/data:/data"]'
      container_options: >-
        --privileged --gpus all --ipc=host --hostname vllm-plugin-fl --user root
        --env VLLM_PLUGINS=fl --env USE_FLAGGEMS=1 --env GEMS_VENDOR=nvidia
        --env USE_FLAGTUNE=0 --ulimit nofile=65535:65535
      cases: '[{"model":"qwen3_6","case":"27b_tp2_eager"},{"model":"qwen3_6","case":"35b_a3b_tp2_graph"}]'
      timeout: 60
  h20-serving:
    name: H20 serving verification
    needs: h20-inference
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_e2e_test.yml
    with:
      platform: cuda
      device: h20
      task: serving
      ci_image: harbor.baai.ac.cn/plugin/vllm-plugin-fl:v0.28.0-cuda-ci
      runner_labels: '["vllm-plugin-ci-h20"]'
      container_volumes: '["/data:/data"]'
      container_options: >-
        --privileged --gpus all --ipc=host --hostname vllm-plugin-fl --user root
        --env VLLM_PLUGINS=fl --env USE_FLAGGEMS=1 --env GEMS_VENDOR=nvidia
        --env USE_FLAGTUNE=0 --ulimit nofile=65535:65535
      cases: '[{"model":"qwen3_6","case":"27b_tp2_graph"},{"model":"qwen3_6","case":"35b_a3b_tp2_eager"}]'
      timeout: 60
